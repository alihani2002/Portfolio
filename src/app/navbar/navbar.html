<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="nav-container">
    <a class="nav-brand" routerLink="/home" (click)="closeMobileMenu()">
      <div class="logo-wrapper">
        <span class="logo-text">A</span>
      </div>
      <div class="brand-info">
        <span class="brand-name">Ali Hani</span>
        <span class="brand-status">Portfolio</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <div class="nav-desktop">
      <ul class="nav-links">
        <li><a [routerLink]="['/home']" fragment="home" (click)="closeMobileMenu()" class="nav-item">Home</a></li>
        <li><a [routerLink]="['/home']" fragment="projects" (click)="closeMobileMenu()" class="nav-item">Projects</a></li>
        <li><a [routerLink]="['/home']" fragment="skills" (click)="closeMobileMenu()" class="nav-item">Skills</a></li>
        <li><a [routerLink]="['/home']" fragment="resume" (click)="closeMobileMenu()" class="nav-item">Resume</a></li>
        <li><a [routerLink]="['/home']" fragment="contact" (click)="closeMobileMenu()" class="nav-item">Contact</a></li>
        <li *ngIf="isAuthenticated$ | async"><a routerLink="/dashboard" routerLinkActive="active" class="nav-item featured">Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <ng-container *ngIf="isAuthenticated$ | async; else loginTemplate">
          <button class="logout-minimal" (click)="logout()" title="Logout">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </ng-container>
        <ng-template #loginTemplate>
          <a routerLink="/login" class="login-chip">Login</a>
        </ng-template>
        <div class="nav-divider"></div>
        <button class="theme-btn" (click)="toggleTheme()" [title]="(theme$ | async) === 'dark' ? 'Light Mode' : 'Dark Mode'">
           <div class="icon-orbit" [class.rotated]="(theme$ | async) === 'light'">
             <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
             <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
           </div>
        </button>
      </div>
    </div>

    <!-- Mobile Menu Toggle -->
    <button class="mobile-toggle" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen">
      <div class="burger"></div>
    </button>
  </div>

  <!-- Mobile Sidebar -->
  <div class="mobile-nav" [class.open]="isMobileMenuOpen">
    <ul class="mobile-links">
      <li><a [routerLink]="['/home']" fragment="home" (click)="closeMobileMenu()">Home</a></li>
      <li><a [routerLink]="['/home']" fragment="projects" (click)="closeMobileMenu()">Projects</a></li>
      <li><a [routerLink]="['/home']" fragment="skills" (click)="closeMobileMenu()">Skills</a></li>
      <li><a [routerLink]="['/home']" fragment="resume" (click)="closeMobileMenu()">Resume</a></li>
      <li><a [routerLink]="['/home']" fragment="contact" (click)="closeMobileMenu()">Contact</a></li>
      <li *ngIf="isAuthenticated$ | async"><a routerLink="/dashboard" (click)="closeMobileMenu()">Dashboard</a></li>
    </ul>

    <div class="mobile-auth">
      <ng-container *ngIf="isAuthenticated$ | async; else mobileLoginTemplate">
        <button class="mobile-logout" (click)="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Logout
        </button>
      </ng-container>
      <ng-template #mobileLoginTemplate>
        <a routerLink="/login" class="mobile-login" (click)="closeMobileMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10,17 15,12 10,7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Login
        </a>
      </ng-template>
    </div>
  </div>
</nav>

<div class="nav-overlay" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>
