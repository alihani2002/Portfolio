<div class="management-container">
  <header class="m-header">
    <div class="header-content">
      <h1>Skills Management</h1>
      <p>Fine-tune your technical and soft skills.</p>
    </div>
    <button class="add-btn" (click)="openCreateModal()">
      <span>+</span> Add Skill
    </button>
  </header>

  <div class="error-bar" *ngIf="error()">{{ error() }}</div>

  <div class="loading-state" *ngIf="isLoading()">
    <div class="spinner"></div>
    <p>Loading expertise...</p>
  </div>

  <div class="grid-wrap" *ngIf="!isLoading()">
    <div class="p-card" *ngFor="let skill of skills()">
      <div class="p-content">
        <span class="p-meta">{{ skill.category }}</span>
        <h3>{{ skill.name }}</h3>
        <div class="skill-gauge" style="margin-bottom: 1.5rem;">
           <div class="gauge-head">
              <span>Proficiency</span>
              <span>{{ skill.level }}%</span>
           </div>
           <div class="gauge-track" style="height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: hidden;">
              <div class="gauge-fill" [style.width.%]="skill.level" style="height: 100%; background: var(--accent);"></div>
           </div>
        </div>
        <div class="p-actions">
           <button class="edit-icon" (click)="editSkill(skill)">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4L18.5 2.5z"></path></svg>
           </button>
           <button class="delete-icon" (click)="deleteSkill(skill.id)">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
           </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" *ngIf="showModal()">
    <div class="modal-card">
      <div class="modal-header">
        <h2>{{ isEditing() ? 'Edit Skill' : 'Add Skill' }}</h2>
        <button class="close-modal" (click)="closeModal()">&times;</button>
      </div>
      
      <form [formGroup]="skillForm" (ngSubmit)="onSubmit()" class="modal-form">
        <div class="form-group">
          <label>Skill Name</label>
          <input type="text" formControlName="name" placeholder="E.g. Angular, .NET Core">
        </div>

        <div class="form-group">
          <label>Category</label>
          <input type="text" formControlName="category" placeholder="E.g. Frontend, Backend, Tools">
        </div>

        <div class="form-group">
          <label>Proficiency Level ({{ skillForm.get('level')?.value }}%)</label>
          <input type="range" formControlName="level" min="0" max="100" step="1" style="cursor: pointer;">
        </div>

        <div class="modal-footer">
          <button type="button" class="cancel-btn" (click)="closeModal()">Cancel</button>
          <button type="submit" class="save-btn" [disabled]="skillForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Saving...' : 'Save Skill' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
